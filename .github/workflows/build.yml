name: Build app (Android + iOS)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generar carpetas de plataforma
        run: flutter create --org pe.ebim --project-name canchas_lima --platforms=android,ios .

      - name: Configurar plataforma (Maps + firma)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/configure_platforms.py

      - name: pub get
        run: flutter pub get

      - name: Generar ícono y splash de marca
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          VERIF_API_URL: ${{ secrets.VERIF_API_URL }}
          GROWTH_API_URL: ${{ secrets.GROWTH_API_URL }}
        run: |
          # --split-per-abi: un APK por arquitectura (mucho más liviano que el
          # universal). El arm64-v8a sirve a la gran mayoría de teléfonos.
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=MAPS_API_KEY="$MAPS_API_KEY" \
            --dart-define=PLACES_API_KEY="$PLACES_API_KEY" \
            --dart-define=VERIF_API_URL="$VERIF_API_URL" \
            --dart-define=GROWTH_API_URL="$GROWTH_API_URL"

      - name: Verificar firma del APK
        run: |
          echo "SHA-1 del certificado con que se firmó el APK (arm64):"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E "SHA1:|SHA-1:" || echo "(no se pudo leer; revisar firma)"

      - name: Renombrar APK
        run: |
          mkdir -p dist
          # Principal (recomendado): arm64-v8a, liviano, ~95% de los teléfonos.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/pichangol-${{ github.run_number }}.apk"
          # Respaldo para teléfonos antiguos de 32 bits.
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/pichangol-${{ github.run_number }}-arm32.apk"
          ls -lh dist/

      - name: Subir APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pichangol-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Limpiar assets viejos del Release
        if: github.ref == 'refs/heads/claude/apk-google-maps-setup-fvpl9w' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | while read -r a; do
            [ -n "$a" ] && gh release delete-asset v0.1.0 "$a" -y -R "$GITHUB_REPOSITORY" || true
          done

      - name: Publicar APK en Release (v0.1.0)
        if: github.ref == 'refs/heads/claude/apk-google-maps-setup-fvpl9w' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Pichangol v0.1.0
          body: |
            APK de **Pichangol** (build #${{ github.run_number }}) — canchas de fútbol, tenis, pádel y pickleball en Lima.

            **Descarga recomendada:** `pichangol-${{ github.run_number }}.apk` (arm64, liviano — sirve para casi todos los teléfonos).
            Si no instala (teléfono antiguo de 32 bits), usa `pichangol-${{ github.run_number }}-arm32.apk`.

            Instálalo por sideload. Verifica en Ajustes → Apps → Pichangol que la versión sea (${{ github.run_number }}).
          files: dist/pichangol-*.apk
          fail_on_unmatched_files: true

  ios:
    name: iOS (compilación, sin firma)
    runs-on: macos-14
    # Best-effort: valida que el código es iOS-ready. Un instalable .ipa requiere
    # firma con cuenta Apple Developer, así que este job no bloquea el APK.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generar carpetas de plataforma
        run: flutter create --org pe.ebim --project-name canchas_lima --platforms=android,ios .

      - name: Configurar plataforma (Maps + Google Sign-In)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: python3 tool/configure_platforms.py

      - name: pub get
        run: flutter pub get

      - name: Generar ícono y splash de marca
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build iOS (sin firma)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          VERIF_API_URL: ${{ secrets.VERIF_API_URL }}
          GROWTH_API_URL: ${{ secrets.GROWTH_API_URL }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=MAPS_API_KEY="$MAPS_API_KEY" \
            --dart-define=PLACES_API_KEY="$PLACES_API_KEY" \
            --dart-define=VERIF_API_URL="$VERIF_API_URL" \
            --dart-define=GROWTH_API_URL="$GROWTH_API_URL"
