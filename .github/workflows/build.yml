name: Build app (Android + iOS)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generar carpetas de plataforma
        run: flutter create --org pe.ebim --project-name canchas_lima --platforms=android .

      - name: Configurar Google Maps (Android)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: python3 tool/configure_platforms.py

      - name: pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/canchas-lima-${GITHUB_REF_NAME//\//-}.apk"

      - name: Subir APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: canchas-lima-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar en Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  ios:
    name: iOS (compilación, sin firma)
    runs-on: macos-14
    # Best-effort: valida que el código es iOS-ready. Un instalable .ipa requiere
    # firma con cuenta Apple Developer, así que este job no bloquea el APK.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generar carpetas de plataforma
        run: flutter create --org pe.ebim --project-name canchas_lima --platforms=ios .

      - name: Configurar Google Maps (iOS)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: python3 tool/configure_platforms.py

      - name: pub get
        run: flutter pub get

      - name: Build iOS (sin firma)
        run: flutter build ios --release --no-codesign
