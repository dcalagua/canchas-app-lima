name: canchas_lima
description: "Pichangol — marketplace de canchas de tenis y pádel en Lima."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  google_sign_in: ^6.2.1
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  image: ^4.2.0
  supabase_flutter: ^2.5.0
  intl: ^0.19.0
  http: ^1.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Algunos plugins (geolocator_android 4.6+, app_links 6.4+) referencian
# flutter.compileSdkVersion, que no está disponible para subproyectos en este
# entorno y rompe el build. Forzamos versiones que hardcodean compileSdk.
dependency_overrides:
  geolocator_android: 4.5.5
  app_links: 6.3.3
  package_info_plus: 8.3.1
  passkeys_doctor: 1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

# Ícono de app (pin de ubicación + pelota, marca Pichangol).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B6B45"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Splash nativo (arranque en frío) — fondo verde de marca + logo.
flutter_native_splash:
  color: "#0B6B45"
  image: assets/splash/logo.png
  android_12:
    color: "#0B6B45"
    image: assets/splash/logo.png
