name: canchas_lima
description: "Pichangol — marketplace de canchas de fútbol, tenis y pádel en Lima."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  google_sign_in: ^6.2.1
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  image: ^4.2.0
  supabase_flutter: ^2.5.0
  intl: ^0.19.0
  http: ^1.2.0
  google_fonts: ^6.2.1
  font_awesome_flutter: 10.8.0
  url_launcher: ^6.3.0
  # Pasarela de pago de BOLIVIA (Libélula): el pago se hace en la página hospedada
  # de Libélula (QR · tarjeta · Tigo Money) DENTRO de un WebView. El compileSdk de
  # su plugin nativo lo cubre el fix global de subproyectos (tool/configure_platforms).
  webview_flutter: ^4.7.0
  # Notificaciones push del chat (Etapa B). Fail-safe: si el APK no trae la
  # config de Firebase (google-services.json), el push queda desactivado y la
  # app sigue igual (ver lib/services/push_service.dart).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Notas de voz en el chat: grabar (record) + reproducir (audioplayers) +
  # archivo temporal (path_provider). record_android se fija abajo a una versión
  # que hardcodea compileSdk (la 1.5.x usa flutter.compileSdkVersion y rompe CI).
  record: ^5.1.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  # Caché LOCAL device-first del chat (SQLite): pinta al instante desde el
  # teléfono aunque Android haya matado la app, y solo sincroniza lo nuevo.
  # Plugin nativo: se prueba en build aislado antes de usarlo (Flutter 3.24.5).
  sqflite: ^2.3.3+1
  # Comprobante de pago en PDF (generar) + compartir/descargar (hoja del sistema).
  # `pdf` es Dart puro; `printing` da la hoja de compartir/guardar del SO.
  pdf: ^3.11.1
  printing: ^5.13.3
  # OCR on-device para validar el documento donde NO hay API oficial (Bolivia/CI):
  # confirma que la foto ES un documento (palabras clave) y extrae nº + fecha de
  # nacimiento. Gratis/offline (ML Kit). Plugin nativo: el CI ya fuerza
  # compileSdk 34 en subproyectos y minSdk 23; en iOS se sube el target a 15.5.
  google_mlkit_text_recognition: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Algunos plugins (geolocator_android 4.6+, app_links 6.4+) referencian
# flutter.compileSdkVersion, que no está disponible para subproyectos en este
# entorno y rompe el build. Forzamos versiones que hardcodean compileSdk.
dependency_overrides:
  geolocator_android: 4.5.5
  app_links: 6.3.3
  package_info_plus: 8.3.1
  passkeys_doctor: 1.4.0
  # record_android 1.4+/1.5 usa flutter.compileSdkVersion (rompe CI). La 1.3.3
  # hardcodea compileSdk 34 (changelog "Gradle compile SDK to 34"), minSdk 23.
  record_android: 1.3.3
  # record_platform_interface 1.6.0 agregó startStream() y hasPermission(request:)
  # que record_linux 0.7.2 NO implementa (record capa record_linux a <1.0.0). Pub
  # flotaba la interfaz a 1.6.0 por ^1.2.0 y rompía el kernel_snapshot. La clavamos
  # a 1.2.0 (era real de record_linux 0.7.2): pub baja darwin→1.2.2, web→1.1.9,
  # windows→1.0.6, todo pre-startStream y consistente. record_android 1.3.3 y
  # record 5.2.x piden ^1.2.0, así que 1.2.0 les basta.
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
    - assets/geo/

# Ícono de app (pelota Pichangol sobre verde de marca).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#128C7E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Splash nativo (arranque en frío) — fondo BLANCO premium + logo verde con pelota
# (identidad Opción A; empalma con el splash claro de la app).
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/splash/logo.png
