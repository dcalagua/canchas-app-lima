name: canchas_lima
description: "Pichangol — marketplace de canchas de fútbol, tenis y pádel en Lima."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  google_sign_in: ^6.2.1
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  image: ^4.2.0
  supabase_flutter: ^2.5.0
  intl: ^0.19.0
  http: ^1.2.0
  google_fonts: ^6.2.1
  font_awesome_flutter: 10.8.0
  url_launcher: ^6.3.0
  # Notificaciones push del chat (Etapa B). Fail-safe: si el APK no trae la
  # config de Firebase (google-services.json), el push queda desactivado y la
  # app sigue igual (ver lib/services/push_service.dart).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Notas de voz en el chat (Inc. 5): grabar + reproducir + carpeta temporal.
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Algunos plugins (geolocator_android 4.6+, app_links 6.4+) referencian
# flutter.compileSdkVersion, que no está disponible para subproyectos en este
# entorno y rompe el build. Forzamos versiones que hardcodean compileSdk.
dependency_overrides:
  geolocator_android: 4.5.5
  app_links: 6.3.3
  package_info_plus: 8.3.1
  passkeys_doctor: 1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

# Ícono de app (pelota Pichangol sobre verde de marca).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#171B34"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Splash nativo (arranque en frío) — fondo ÍNDIGO nocturna + pin lima.
flutter_native_splash:
  color: "#171B34"
  image: assets/splash/logo.png
  android_12:
    color: "#171B34"
    image: assets/splash/logo.png
